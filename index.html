const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IN=new Map(CAT.i.map(x=>[x.c,x])),AN=new Map(CAT.a.map(x=>[x.c,x])),nm=c=>(IN.get(c)||AN.get(c)||{n:c||'-'}).n;
const S={d:null,fh:null,bh:null,dirty:0,tab:'res',q:'',cat:'',open:-1,fn:'idleguild_save.json',raw:''};
const FSA='showOpenFilePicker'in window&&'showSaveFilePicker'in window;
const SL={weapon:['Dagger','Sword','Staff','Bow'],armor:['Heavy Armor','Medium Armor','Light Armor'],accessory:['Accessory']};
const DOC=['EmptyDoctrine','DoctrineOfAffliction','DoctrineOfControl','DoctrineOfFortitude','DoctrineOfGrace','DoctrineOfIllusion','DoctrineOfKnowledge','DoctrineOfRuin','DoctrineOfWar'];
const TABS=[['res','Sumber daya'],['items','Item'],['adv','Karakter'],['guild','Guild'],['json','JSON']];
const dl=(id,a)=>`<datalist id=${id}>${a.map(x=>`<option value="${x.c}">${esc(x.n)}</option>`).join('')}</datalist>`;
document.body.insertAdjacentHTML('beforeend',dl('al',CAT.a)+Object.entries(SL).map(([k,v])=>dl('dl_'+k,CAT.i.filter(x=>v.includes(x.t)))).join(''));
const toast=(m,e)=>{const t=$('#t');t.textContent=m;t.className=e?'e show':'show';clearTimeout(toast.i);toast.i=setTimeout(()=>t.className='',3800)};
const db=()=>new Promise((r,j)=>{const q=indexedDB.open('igm',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const kv=async(k,v)=>{try{const d=await db();return await new Promise((r,j)=>{const o=d.transaction('k',v===undefined?'readonly':'readwrite').objectStore('k'),q=v===undefined?o.get(k):o.put(v,k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}catch(e){return null}};
const perm=async h=>{if(await h.queryPermission({mode:'readwrite'})==='granted')return;if(await h.requestPermission({mode:'readwrite'})!=='granted')throw Error('Izin file ditolak')};
const setp=(o,p,v)=>{const k=p.split('.');while(k.length>1){const n=k.shift();o=o[n]??(o[n]={})}o[k[0]]=v};
const mt=c=>!S.q||(nm(c)+c).toLowerCase().includes(S.q.toLowerCase());
const dirty=()=>{S.dirty=1;st()};
const st=()=>{const e=$('#st');e.className=S.dirty?'d':'';e.textContent=S.d?(S.fn+(S.dirty?' - ada perubahan belum disimpan':' - tersimpan')+(FSA?'':' (mode unduh)')):'Belum ada file dibuka'};
const prep=t=>{S.d=JSON.parse(t);S.d.items??=[];S.d.adventurers??=[];S.dirty=0;S.open=-1;S.raw=t;render()};
async function load(){await perm(S.fh);const f=await S.fh.getFile();S.fn=f.name;prep(await f.text())}
async function openMain(){try{if(FSA){[S.fh]=await showOpenFilePicker({id:'igm',types:[{description:'Save JSON',accept:{'application/json':['.json']}}]});kv('fh',S.fh);await load()}else{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{const f=i.files[0];if(f){S.fn=f.name;prep(await f.text())}};i.click()}}catch(e){if(e.name!='AbortError')toast(e.message,1)}}
async function refresh(){if(S.dirty&&!confirm('Perubahan yang belum disimpan akan hilang. Lanjutkan?'))return;try{if(FSA&&S.fh){await load();toast('Dimuat ulang dari file')}else openMain()}catch(e){toast(e.message,1)}}
async function pickBackup(){S.bh=await showSaveFilePicker({id:'igmb',suggestedName:'idleguild_save_backup.json',types:[{description:'Backup JSON',accept:{'application/json':['.json']}}]});kv('bh',S.bh)}
const dlf=(t,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=n;a.click()};
async function save(){if(!S.d)return toast('Buka file dulu',1);try{const out=JSON.stringify(S.d);
if(FSA&&S.fh){if(!S.bh){toast('Pilih lokasi file backup (sekali saja)');await pickBackup()}
await perm(S.fh);await perm(S.bh);const disk=await(await S.fh.getFile()).text();
let w=await S.bh.createWritable();await w.write(disk);await w.close();
w=await S.fh.createWritable();await w.write(out);await w.close()}
else{dlf(S.raw,'idleguild_save_backup.json');dlf(out,S.fn)}
S.raw=out;S.dirty=0;st();toast('Tersimpan. Backup diperbarui.')}catch(e){toast(e.name=='AbortError'?'Dibatalkan, belum disimpan':'Gagal: '+e.message,1)}}
const num=(v,a)=>`<input type=number inputmode=numeric ${a} value="${v??0}">`;
function vRes(){return['money','gems'].map(k=>`<div class=card><b>${k=='money'?'Uang':'Gem'} (${k})</b><div class=bar>${num(S.d[k],`data-p=${k}`)}${[1e3,1e6,1e9].map(n=>`<button data-x=add data-v="${k}:${n}">+${n>=1e9?'1B':n>=1e6?'1M':'1K'}</button>`).join('')}</div></div>`).join('')+'<p class=m>Nilai besar bisa merusak save. Naikkan bertahap.</p>'}
function vItems(){const cats=[...new Set(CAT.i.map(x=>x.t))].sort(),c=S.cat;
let h=`<div class=bar><input id=q placeholder="Cari item..." value="${esc(S.q)}"><select id=c><option value="">Semua</option>${cats.map(t=>`<option${t==c?' selected':''}>${t}</option>`).join('')}</select></div><h3>Inventori (${S.d.items.length})</h3>`;
h+=S.d.items.map((it,i)=>[it,i]).filter(([it])=>mt(it.trueClass)&&(!c||(IN.get(it.trueClass)||{}).t==c)).slice(0,80).map(([it,i])=>`<div class=row><span>${esc(nm(it.trueClass))}<small>${esc(it.trueClass)}</small></span>${num(it.stack,`data-i=${i}`)}<button class=x data-x=del data-v=${i}>x</button></div>`).join('')||'<p class=m>Kosong.</p>';
h+='<h3>Tambah item</h3>'+CAT.i.filter(x=>(!c||x.t==c)&&mt(x.c)).slice(0,60).map(x=>`<div class=row><span>${esc(x.n)}<small>${x.t} - ${x.c}</small></span><input type=number min=1 value=1 id="n_${x.c}"><button data-x=new data-v="${x.c}">+</button></div>`).join('');return h}
function advForm(a,i){const f=(p,l,v)=>`<div><label>${l}</label>${num(v,`data-a="${i}|${p}"`)}</div>`;
const sl=Object.keys(SL).map(k=>`<div><label>${k}</label><input list=dl_${k} data-slot=1 data-a="${i}|${k}" value="${esc(a[k]?.trueClass||'')}" placeholder="kosong"></div>`).join('');
const d=a.doctrine||{};const dc=`<div><label>doctrine</label><select data-a="${i}|doctrine.trueClass">${DOC.map(x=>`<option${x==d.trueClass?' selected':''}>${x}</option>`).join('')}</select></div>`+[1,2,3,4,5,6].map(n=>f('doctrine.l'+n,'doctrine l'+n,d['l'+n])).join('');
const pt=Object.entries(a.potionsDrank||{}).map(([k,v])=>f('potionsDrank.'+k,k.replace('potionOf','').replace('Drank',''),v)).join('');
return`<div class=g>${f('level','Level',a.level)}${f('experience','Experience',a.experience)}<div><label>class</label><input list=al data-a="${i}|trueClass" value="${esc(a.trueClass)}"></div><div><label>ascended</label><input type=checkbox data-a="${i}|ascended"${a.ascended?' checked':''}></div>${sl}${dc}${pt}</div><h3>JSON lanjutan</h3><textarea style="height:140px" data-raw=${i}>${esc(JSON.stringify(a))}</textarea><button class=x data-x=adv- data-v=${i}>Hapus karakter</button>`}
function vAdv(){const A=S.d.adventurers;return`<div class=bar><button data-x=adv+>+ Tambah karakter</button></div>`+(A.map((a,i)=>`<div class=card><div class=row data-x=tog data-v=${i}><span><b>${esc(nm(a.trueClass))}</b><small>Lv ${a.level} - id ${a.id}</small></span></div>${S.open==i?advForm(a,i):''}</div>`).join('')||'<p class=m>Belum ada karakter di guild.</p>')+'<p class=m>Class dan perlengkapan yang tidak cocok bisa membuat game crash. Uji dulu dengan backup.</p>'}
function vGuild(){const sk=['money','gems'];return`<div class=bar><input id=q placeholder="Cari pengaturan..." value="${esc(S.q)}"></div><div class=g>`+Object.keys(S.d).filter(k=>!sk.includes(k)&&['number','boolean','string'].includes(typeof S.d[k])&&(!S.q||k.toLowerCase().includes(S.q.toLowerCase()))).map(k=>{const v=S.d[k];return`<div><label>${k}</label>${typeof v=='boolean'?`<input type=checkbox data-p=${k}${v?' checked':''}>`:typeof v=='number'?num(v,`data-p=${k}`):`<input data-p=${k} value="${esc(v)}">`}</div>`}).join('')+'</div>'}
function vJson(){return`<textarea id=js>${esc(JSON.stringify(S.d,null,1))}</textarea><button data-x=jsa>Terapkan JSON</button>`}
function render(){$('#nv').innerHTML=TABS.map(([k,l])=>`<button data-x=tab data-v=${k}${S.tab==k?' class=on':''}>${l}</button>`).join('');st();
if(!S.d){$('#v').innerHTML=`<div class=card><p>Buka <b>idleguild_save.json</b> dari folder Download (hasil tombol Backup di game).</p><button class=p data-x=open>Buka file</button>${S.fh?`<button data-x=resume>Lanjutkan: ${esc(S.fh.name)}</button>`:''}${FSA?'':'<p class=m>Browser ini tidak bisa menimpa file langsung. Pakai Chrome terbaru. Mode unduh: file hasil unduhan bernama baru dan tidak menimpa.</p>'}</div>`;return}
$('#v').innerHTML={res:vRes,items:vItems,adv:vAdv,guild:vGuild,json:vJson}[S.tab]()}
document.addEventListener('change',e=>{const t=e.target;if(!S.d)return;const v=t.type=='checkbox'?t.checked:t.type=='number'?Math.max(0,Math.min(9e15,Math.trunc(+t.value||0))):t.value;
if(t.dataset.p!=null){setp(S.d,t.dataset.p,v);dirty()}
else if(t.dataset.i!=null){S.d.items[t.dataset.i].stack=Math.max(1,v);dirty()}
else if(t.dataset.a!=null){const[i,p]=t.dataset.a.split('|'),a=S.d.adventurers[i];if(t.dataset.slot){v?a[p]={...a[p],stack:1,trueClass:v}:delete a[p]}else setp(a,p,v);dirty();if(p=='trueClass'||p=='level')render()}
else if(t.id=='c'){S.cat=v;render()}
else if(t.dataset.raw!=null){try{S.d.adventurers[t.dataset.raw]=JSON.parse(t.value);dirty();render()}catch(x){toast('JSON tidak valid',1)}}});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;clearTimeout(S.tm);S.tm=setTimeout(()=>{render();const i=$('#q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-x]');if(!b)return;const k=b.dataset.x,v=b.dataset.v,A=S.d&&S.d.adventurers;
if(k=='open')openMain();else if(k=='refresh')refresh();else if(k=='save')save();
else if(k=='resume'){try{await load()}catch(x){toast(x.message,1)}}
else if(k=='tab'){S.tab=v;S.q='';render()}
else if(!S.d)return;
else if(k=='add'){const[f,n]=v.split(':');S.d[f]=Math.min(9e15,(S.d[f]||0)+ +n);dirty();render()}
else if(k=='del'){S.d.items.splice(v,1);dirty();render()}
else if(k=='new'){const n=Math.max(1,Math.trunc(+$('#n_'+v).value||1)),x=S.d.items.find(i=>i.trueClass==v&&Object.keys(i).length==2);x?x.stack+=n:S.d.items.push({stack:n,trueClass:v});dirty();render();toast('Ditambahkan: '+nm(v)+' x'+n)}
else if(k=='tog'){S.open=S.open==v?-1:+v;render()}
else if(k=='adv+'){const t=JSON.parse(JSON.stringify(A[0]||(S.d.tavernGuests||[])[0]||{ascended:false,doctrine:{l1:0,l2:0,l3:0,l4:0,l5:0,l6:0,trueClass:'EmptyDoctrine'},experience:0,level:1,potionsDrank:{},seen:false,timeWhenDismissed:0,currentHp:0,currentMana:0,currentShield:0,negativeStatusEffects:[],positiveStatusEffects:[],trueClass:'Footman'}));t.id=Math.max(0,...A.map(a=>a.id))+1;t.level=1;t.experience=0;A.push(t);S.open=A.length-1;dirty();render()}
else if(k=='adv-'){if(confirm('Hapus karakter ini?')){A.splice(v,1);S.open=-1;dirty();render()}}
else if(k=='jsa'){try{S.d=JSON.parse($('#js').value);S.d.items??=[];S.d.adventurers??=[];dirty();toast('JSON diterapkan (belum disimpan)')}catch(x){toast('JSON tidak valid: '+x.message,1)}}});
window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue=''}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{S.fh=await kv('fh');S.bh=await kv('bh');render()})();
