ract enemy attention, distracting them from the party.","p":100,"o":["Frostbite Peaks"]},{"c":"ConstructEgg","n":"Construct Egg","t":"Egg","d":"Egg that will hatch a pet Construct. Constructs usually like to use magic to impair enemies and illuminate dark areas.","p":100,"o":["The Cultist Rebels"]},{"c":"EsotericEgg","n":"Esoteric Egg","t":"Egg","d":"Egg that will hatch an Esoteric pet. Esoteric pets like to provide indirect bonuses, like granting enhanced learning, or finding more items.","p":100,"o":["The Lost Expedition"]},{"c":"InsectEgg","n":"Insect Egg","t":"Egg","d":"Egg that will hatch a pet Insect. Insects usually like to attack enemies, and grant damage reduction.","p":100,"o":["The Southern Grove"]},{"c":"ReptileEgg","n":"Reptile Egg","t":"Egg","d":"Egg that will hatch a pet Reptile. Reptiles usually enhance the team offensive capabilities.","p":100,"o":["Barren Wastelands"]},{"c":"WildEgg","n":"Wild Egg","t":"Egg","d":"Egg that will hatch a Wild pet. Wild pets usually provide strategic support to the team, enhancing health management and offensive capabilities.","p":100,"o":["Blackwater Port"]},{"c":"WoodenEgg","n":"Wooden Egg","t":"Egg","d":"Egg that will hatch a Wooden pet. Wooden pets like to help the team stay alive, and are rarely keen for harming enemies.","p":100,"o":["The Southern Grove"]},{"c":"Algae","n":"Algae","t":"Food","d":"Thin, greenish-brown plant that lives underwater. Its taste is salty and briny, and it's used mostly for exotic recipe typical of seaside settlements.","p":1,"s":{"feedPower":1},"o":["Blackwater Port"]},{"c":"Ambrosia","n":"Ambrosia","t":"Food","d":"A golden ethereal drink, extremely sweet and with a caloric intake which is off the charts. The way it's produced is unknown, but is sometimes carried from unknown lands by the traveling merchants.","p":1000,"s":{"feedPower":13500}},{"c":"Apple","n":"Apple","t":"Food","d":"Round and glossy, with skin colors ranging from red to yellow. It’s crisp, juicy, and sweet, with a slight tartness.","p":1,"s":{"feedPower":4},"o":["Enchanted Forest"]},{"c":"ApplePie","n":"Apple Pie","t":"Food","d":"A golden, flaky crust surrounds a soft, spiced apple filling. It’s sweet and slightly tart, with cinnamon adding warmth to the juicy, tender apples.","p":51,"s":{"feedPower":122}},{"c":"Avocado","n":"Avocado","t":"Food","d":"It has a smooth, dark green skin with a creamy, buttery flesh inside. It’s mild and rich in fats, with a subtle, nutty flavor. Complements some of the most exotic, fish based recipes.","p":20,"s":{"feedPower":36},"o":["The Southern Grove"]},{"c":"Banana","n":"Banana","t":"Food","d":"Yellow, sweet fruit found in tropical lands. Monkeys love them, even ones employed by the Skull Island fleet.","p":2,"s":{"feedPower":8},"o":["Blackwater Port"]},{"c":"Blueberry","n":"Blueberry","t":"Food","d":"Small and round, deep blue or purple in color. Usually found in the colder mountain trails, it has a slightly tart flavors, and leaves a mildly floral aftertaste.","p":1,"s":{"feedPower":8},"o":["Frostbite Peaks"]},{"c":"BlueberryPancake","n":"Blueberry Pancake","t":"Food","d":"A fluffy, golden-brown pancake dotted with juicy blueberries. It’s soft and sweet, with bursts of tart blueberry flavor in each bite.","p":8,"s":{"feedPower":17}},{"c":"BlueberrySmoothie","n":"Blueberry Smoothie","t":"Food","d":"A thick, purple blend of blueberries and creamy ingredients. This recipe is not commonly found, as the few blueberries brought back from the troll ridden mountains were reserved for kings and princes.","p":38,"s":{"feedPower":85}},{"c":"Bread","n":"Bread","t":"Food","d":"A soft, golden-brown crust gives way to a fluffy, airy interior. It's one of the most common foods in the Realms, enjoyed by paesants, soldiers and nobles alike.","p":12,"s":{"feedPower":18}},{"c":"Butter","n":"Butter","t":"Food","d":"A smooth, pale yellow spread that’s rich and creamy. It melts quickly, releasing a mild, slightly salty flavor with a hint of sweetness.","p":3,"s":{"feedPower":7}},{"c":"CeremonialCake","n":"Ceremonial Cake","t":"Food","d":"A grand, multi-layered cake with intricate decorations. Reserved for special occasions like the marriage of a royal, one of these cakes can feed a hundred guests.","p":2200,"s":{"feedPower":30000}},{"c":"Cheese","n":"Cheese","t":"Food","d":"Solid milk derivative, ranging in color from yellow to orange. Its flavor is sharp and salty, and it's used in many delicious recipes.","p":8,"s":{"feedPower":9},"o":["Enchanted Forest"]},{"c":"CheeseRisotto","n":"Cheese Risotto","t":"Food","d":"Creamy, soft rice infused with melted cheese. It tastes mildly salty, with a smooth consistency.","p":44,"s":{"feedPower":130}},{"c":"Cheesecake","n":"Cheesecake","t":"Food","d":"A creamy, dense dessert with a smooth, rich texture. Tastes incredibly good, and pets love this.","p":450,"s":{"feedPower":6375}},{"c":"Chocolate","n":"Chocolate","t":"Food","d":"Exotic food that only the upper class citizen of the Capital can usually acquire. Melts on the tongue releasing sweet, slightly bitter, and complex cocoa flavors with a creamy finish.","p":10,"s":{"feedPower":20},"o":["Imperial Rescue"]},{"c":"Coffee","n":"Coffee","t":"Food","d":"Deep brown liquid with a strong, earthy aroma. Nutritional content is close to zero, but allows for cooking delicious recipes.","p":15,"s":{"feedPower":1},"o":["Imperial Rescue"]},{"c":"Cookie","n":"Cookie","t":"Food","d":"Golden and slightly crispy chocolate sweet with a soft, chewy center. A refined food destined to the breakfast of nobles, ambassadors and rich merchants.","p":21,"s":{"feedPower":29}},{"c":"DeviledEggs","n":"Deviled Eggs","t":"Food","d":"Halved boiled eggs with a yolk filling. The filling is extremely spicy, so this dish is not for every palate.","p":129,"s":{"feedPower":238}},{"c":"DinoRibs","n":"Dino Ribs","t":"Food","d":"Massive, meaty ribs with a thick, tender texture. Packed with protein, they make a hearty meal, but the ancient beasts they come from are incredibly challenging to hunt.","p":20,"s":{"feedPower":30},"o":["Lost Lands"]},{"c":"Egg","n":"Egg","t":"Food","d":"A smooth, oval shell encasing a firm white and a bright yellow yolk. When cooked, it becomes either soft and creamy or firm, with a mild, rich taste.","p":2,"s":{"feedPower":10},"o":["The Southern Grove"]},{"c":"ExoticFruitSalad","n":"Exotic fruit Salad","t":"Food","d":"Complemented with pineapple pieces, this fruit salad is juicy, sweet, and tangy, offering a burst of tropical flavors.","p":23,"s":{"feedPower":46}},{"c":"FreshSalmon","n":"Fresh salmon","t":"Food","d":"A vibrant pink-orange fish with a firm, yet tender meat. Fished in the waters just above Blackwater Port, its taste is rich, buttery, and slightly sweet, with a moist, flaky texture when cooked.","p":10,"s":{"feedPower":18},"o":["Blackwater Port"]},{"c":"FreshTuna","n":"Fresh Tuna","t":"Food","d":"Deep red, firm flesh that’s meaty and dense. Valuable fish rarely found in the high seas, it has a clean, mild flavor with a slight hint of salt.","p":15,"s":{"feedPower":25},"o":["Blackwater Port"]},{"c":"FrozenBreathBroth","n":"Frozen Breath Broth","t":"Food","d":"A cold, misty soup with an icy, translucent appearance. The broth helps to make the Wyvern meat more tender, but chewing it is still a daunting task for many.","p":41,"s":{"feedPower":219}},{"c":"FruitSalad","n":"Fruit Salad","t":"Food","d":"A colorful mix of fresh, juicy fruits, sweet and with a soft bite and a vibrant, refreshing flavor.","p":9,"s":{"feedPower":26}},{"c":"GlazedDonut","n":"Glazed Donut","t":"Food","d":"A soft, fluffy ring of dough coated in a glossy, sugary glaze. Popular among the north-eastern settlers, the exact recipe is not known.","p":45,"s":{"feedPower":600}},{"c":"GourmetIcecream","n":"Gourmet Icecream","t":"Food","d":"An experimental way of serving a cold , sweet flavoured cream. It's a rare speciality only a few select food lovers ever had a chance to taste.","p":100,"s":{"feedPower":1350}},{"c":"Grains","n":"Grains","t":"Food","d":"A small bag of dry kernels with various shapes and colors. They have a slightly chewy texture when cooked and a neutral, earthy flavor.","p":1,"s":{"feedPower":4},"o":["Divine Archeology"]},{"c":"GrilledCheese","n":"Grilled Cheese","t":"Food","d":"Golden, crispy bread surrounds melted, gooey cheese. The sandwich is warm and rich, with a satisfying crunch and a creamy, salty interior.","p":30,"s":{"feedPower":60}},{"c":"HeavenAndHell","n":"Heaven and Hell","t":"Food","d":"The epitome of experimental, nouvelle cuisine. A taco using the hard Wyvern meat as filling, completed with the hottest sauce in the realms. A unique experience for sure, but definitely not for everyone.","p":167,"s":{"feedPower":362}},{"c":"HellishRations","n":"Hellish Rations","t":"Food","d":"A dark, revolting soup with an eye floating in it. You can’t tell if the eye fell in by accident or if it’s part of the recipe. It looks vile, and there’s only one way to find out if it will kill you.","p":50,"s":{"feedPower":106},"o":["Hidden City of Larox"]},{"c":"Leek","n":"Leek","t":"Food","d":"Long and cylindrical with pale green and white layers. Its flavor is mildly sweet, like a delicate cross between onions and garlic, with a crisp, firm texture.","p":1,"s":{"feedPower":2},"o":["Enchanted Forest"]},{"c":"MascarponeCheese","n":"Mascarpone Cheese","t":"Food","d":"Smooth, creamy, and white with a rich, buttery texture. It has a mild, slightly sweet taste and a velvety consistency that melts easily.","p":59,"s":{"feedPower":143}},{"c":"Maxxiburger","n":"Maxxiburger","t":"Food","d":"A massive, towering burger with layers of juicy meat, melted cheese, crisp lettuce, and savory sauces. Not very healthy, but extremely caloric.","p":220,"s":{"feedPower":3000}},{"c":"MeatChop","n":"Meat Chop","t":"Food","d":"A thick, juicy cut of meat complete with a bone. It's the cheap, nutritious base for most meat based dishes.","p":2,"s":{"feedPower":10},"o":["Enchanted Forest"]},{"c":"MeatPie","n":"Meat Pie","t":"Food","d":"A golden, flaky pastry crust surrounds a savory filling of tender meat. It’s warm, hearty, and packed with robust, meaty flavors.","p":35,"s":{"feedPower":115}},{"c":"MeatStew","n":"Meat Stew","t":"Food","d":"A warm, hearty mixture of slow-cooked ingredients. Tender chunks of meat float along with vegetables in the broth.","p":42,"s":{"feedPower":168}},{"c":"MeatyMushroom","n":"Meaty Mushroom","t":"Food","d":"Soft and spongy with an earthy, mild flavor. Rarely found in the southern forests, where the damp climate sometimes allows for their growth.","p":5,"s":{"feedPower":22},"o":["The Southern Grove"]},{"c":"Milk","n":"Milk","t":"Food","d":"White and smooth with a creamy consistency. It’s mild, slightly sweet, and soothing. Can be turned into many derivatives, used in a large amount of recipes.","p":1,"s":{"feedPower":2},"o":["Divine Archeology"]},{"c":"MushroomOmelette","n":"Mushroom Omelette","t":"Food","d":"A fluffy, golden omelette filled with tender mushrooms. It’s soft and savory, with a rich flavor and a slightly creamy texture.","p":17,"s":{"feedPower":41}},{"c":"MushroomRisotto","n":"Mushroom Risotto","t":"Food","d":"Creamy rice with tender Meaty Mushrooms. A very esteemed dish, given the difficulty of importing this kind of mushrooms in the northern cities even prior to the corruption.","p":65,"s":{"feedPower":227}},{"c":"MushroomStew","n":"Mushroom Stew","t":"Food","d":"A warm, earthy dish filled with tender mushrooms. The broth is thick and flavorful, with a slightly spongy texture.","p":54,"s":{"feedPower":217}},{"c":"Pasta","n":"Pasta","t":"Food","d":"Long spaghetti derived from grains, a common food found in many towns and villages. It provides a satisfying, slightly chewy texture and can be perfected with sauce.","p":24,"s":{"feedPower":59}},{"c":"PastaWithSauce","n":"Pasta with Sauce","t":"Food","d":"Long spaghetti derived from grains, a common food found in many towns and villages, coated in a bright red sauce.","p":66,"s":{"feedPower":173}},{"c":"Pear","n":"Pear","t":"Food","d":"With a smooth yellow skin, their flesh is soft, juicy, and sweet with a grainy texture that will melt in the mouth.","p":1,"s":{"feedPower":3}},{"c":"PearPie","n":"Pear Pie","t":"Food","d":"A buttery, golden crust holds a soft, sweet pear filling. The pears are tender and juicy, with a delicate sweetness and subtle spiced aroma.","p":51,"s":{"feedPower":139}},{"c":"Pineapple","n":"Pineapple","t":"Food","d":"A spiky, golden-brown exterior hides bright yellow flesh. It’s juicy, tangy, and sweet with an exotic, refreshing flavor.","p":3,"s":{"feedPower":8},"o":["Divine Archeology"]},{"c":"Potato","n":"Potato","t":"Food","d":"A starchy, oblong vegetable with a brown skin, considered a staple in the common villager diet. Its inside is soft, fluffy, and mildly earthy when cooked.","p":1,"s":{"feedPower":6},"o":["Imperial Rescue"]},{"c":"PotatoMash","n":"Potato Mash","t":"Food","d":"Smooth, creamy mashed potatoes with a buttery flavor. It's a simple dish enjoyed by every social class in the Realms.","p":9,"s":{"feedPower":27}},{"c":"Pumpkin","n":"Pumpkin","t":"Food","d":"Vibrantly orange with smooth, firm flesh. They grow only in the upper caverns below the Gates of Hell, thriving in the Nexus artificial light.","p":15,"s":{"feedPower":24},"o":["Hidden City of Larox"]},{"c":"RedReaper","n":"Red Reaper","t":"Food","d":"A small, wrinkled red pepper with a sinister appearance. Its taste is fiery and incredibly spicy, leaving a sharp, lingering heat on the tongue.","p":10,"s":{"feedPower":2},"o":["Imperial Rescue"]},{"c":"RedReaperSauce","n":"Red Reaper Sauce","t":"Food","d":"A fiery, bright red sauce with an intense, lingering heat. It’s incredibly spicy, not very nutritious by itself and it's highly recommended to not eat this alone.","p":80,"s":{"feedPower":128}},{"c":"Rice","n":"Rice","t":"Food","d":"Tiny, white smooth grains that, when cooked, present a neutral taste and a soft texture. Often used as the main supply for soldiers embarked in long expeditions, as it is easy to conserve for long times.","p":1,"s":{"feedPower":3},"o":["Frostbite Peaks"]},{"c":"Salad","n":"Salad","t":"Food","d":"A simple mix of crisp leeks and colorful tomatoes. It’s light, crunchy, and refreshing, but not one of the most nutritious dishes.","p":20,"s":{"feedPower":33}},{"c":"SalmonNigiri","n":"Salmon Nigiri","t":"Food","d":"A slice of fresh, bright orange salmon atop a small bed of rice wrapped in seaweed. A staple dish in the diet of sailors, pirates and sea merchants.","p":18,"s":{"feedPower":54}},{"c":"SalmonRoll","n":"Salmon Roll","t":"Food","d":"A sushi roll with soft rice, avocado and fresh salmon. Hard to make since ingredients must be imported from very distant areas, it's considered a delicacy even in the richest cities.","p":47,"s":{"feedPower":65}},{"c":"Salt","n":"Salt","t":"Food","d":"Small, white granules or crystals with a sharp, savory taste. While it's not advised to consume salt alone, it can enhance most recipes. It is also widely used to conserve foods.","p":5,"s":{"feedPower":1},"o":["Imperial Rescue"]},{"c":"Sauce","n":"Sauce","t":"Food","d":"A smooth, liquid or semi-liquid mixture derived from tomatoes, leek and a bit of salt. It adds moisture, richness, and depth to dishes.","p":20,"s":{"feedPower":43}},{"c":"Spices","n":"Spices","t":"Food","d":"Colorful and aromatic, while not able to sate hunger by themselves, they can be added to a lot of recipes to emphasize their taste and appearance.","p":3,"s":{"feedPower":1},"o":["Enchanted Forest"]},{"c":"SteakBraise","n":"Steak Braisé","t":"Food","d":"A slow-cooked, tender steak with a deep brown exterior. It’s rich and flavorful, with a slightly smoky taste.","p":24,"s":{"feedPower":65}},{"c":"Stew","n":"Stew","t":"Food","d":"A warm, hearty mixture of slow-cooked ingredients. It’s thick and comforting, with tender chunks of vegetables suspended in broth.","p":23,"s":{"feedPower":60}},{"c":"Strawberry","n":"Strawberry","t":"Food","d":"Bright red, heart-shaped berries with tiny seeds on the outside, known to grow in the southern forests because of the warmer climate. It’s juicy and sweet, with a slightly tart edge.","p":1,"s":{"feedPower":3},"o":["The Southern Grove"]},{"c":"StrawberryPancake","n":"Strawberry Pancake","t":"Food","d":"A light, fluffy pancake topped or filled with sweet strawberries imported from the southern forests. It’s soft and slightly sweet, with a fresh, juicy pop from the strawberries.","p":8,"s":{"feedPower":22}},{"c":"StrawberrySmoothie","n":"Strawberry Smoothie","t":"Food","d":"A pink, creamy drink bursting with sweet, juicy strawberries. A common, albeit expensive recipe before the corruption struck, when the southern forests creatures were shy and peaceful.","p":38,"s":{"feedPower":102}},{"c":"SweetAndSourMeat","n":"Sweet and Sour Meat","t":"Food","d":"Tender meat chunks coated in a glossy, reddish sauce and pineapple pieces. The flavor is a perfect balance of tangy sweetness and a mild sour kick.","p":21,"s":{"feedPower":38}},{"c":"Taco","n":"Taco","t":"Food","d":"A crunchy bread slice filled with meat, cheese, and sauces. It’s savory and nutritious, with a mix of different textures.","p":78,"s":{"feedPower":184}},{"c":"Tiramisu","n":"Tiramisù","t":"Food","d":"A layered dessert with creamy mascarpone and espresso-soaked cookies. It has a smooth and sweet taste, and it's extremely nutritious.","p":426,"s":{"feedPower":1107}},{"c":"Tomato","n":"Tomato","t":"Food","d":"Round and smooth, with a bright yellow color. Its flesh is juicy and slightly sweet with a tart, refreshing flavor and soft seeds inside.","p":1,"s":{"feedPower":4},"o":["Enchanted Forest"]},{"c":"TunaNigiri","n":"Tuna Nigiri","t":"Food","d":"Deep red tuna on rice, firm yet tender, wrapped in seaweed. A delicacy sometimes found in the diet of pirates and wealthy sea merchants.","p":26,"s":{"feedPower":74}},{"c":"TunaRoll","n":"Tuna Roll","t":"Food","d":"A sushi roll made with red tuna, avocado and rice. Hard to make since ingredients must be imported from very distant areas, it's considered a delicacy even in the richest cities.","p":54,"s":{"feedPower":78}},{"c":"Vinegar","n":"Vinegar","t":"Food","d":"Slightly colored liquid with a sharp, pungent aroma. It delivers a sour, tangy taste that is perfectly suited for some of the more elaborate dishes.","p":7,"s":{"feedPower":1},"o":["Imperial Rescue"]},{"c":"WyvernChop","n":"Wyvern Chop","t":"Food","d":"Few people manage to take down a Wyvern, and even fewer manage to bite through its extremely hard meat. The taste is described as very intense, and the meat as extremely nutritious, with a single bite able to sustain a soldier for a day.","p":1,"s":{"feedPower":75},"o":["Frostbite Peaks"]},{"c":"Yoghurt","n":"Yoghurt","t":"Food","d":"Creamy and smooth milk derivative. White in color, it’s tangy and slightly sour, with a rich, thick consistency that varies from silky to dense.","p":5,"s":{"feedPower":10}},{"c":"AbsoluteZero","n":"Absolute Zero","t":"Heavy Armor","d":"The coldest material ever forged makes up an armor that not only is incredibly resilient, but will FREEZE enemies on contact.\nFREEZE: This unit can't dodge and takes 10 physical damage each turn.","e":"FREEZES melee attackers","p":8889,"s":{"onSelfHit":8889,"maxHp":310,"defense":16}},{"c":"AncientArmor","n":"Ancient Armor","t":"Heavy Armor","d":"Extremely durable armor made with the hardest known metal, lined with remains of prehistoric giants.","p":1092,"s":{"maxHp":330,"constitution":11}},{"c":"AnimatedCuirass","n":"Animated Cuirass","t":"Heavy Armor","d":"Heavy armor made from Animated Metal, pulsating in a pale blue light.","p":756,"s":{"maxHp":300,"constitution":10}},{"c":"ArmorOfTheDryad","n":"Armor of the Dryad","t":"Heavy Armor","d":"Incorporates a single, long Dryad hair that works as a powerful, permanent healing spell.","e":"REGENERATION on self when hit","p":873,"s":{"onSelfHit":873,"maxHp":240}},{"c":"ArmorOfTheUndying","n":"Armor of the Undying","t":"Heavy Armor","d":"A forbidden artifact used to defy death merged with ancient, cursed metal. Serves as a decoy for the life of the wearer, restoring it with an enhanced version of the regular status every time they are hurt.","e":"REGENERATION [+5%] on self when hit","p":49300,"s":{"onSelfHit":49300,"maxHp":350,"regenerationBonus":5}},{"c":"BlackIronArmor","n":"Black Iron Armor","t":"Heavy Armor","d":"Very hard plates made with the pirate's Black Iron make this armor difficult to break.","p":419,"s":{"maxHp":150,"constitution":5}},{"c":"CelestialArmor","n":"Celestial Armor","t":"Heavy Armor","d":"Armor made with alien Celestial Metal. Its superior properties grant an increase in protection from almost any armor crafted with metals found in the Realms.","p":653,"s":{"maxHp":270,"constitution":9}},{"c":"ChampionArmor","n":"Champion Armor","t":"Heavy Armor","d":"Further enhanced with part of the soul of the Primordial titan, this armor reached a perfect attunement with the wearer's mind.","e":"40% counterattack","p":13300,"s":{"maxHp":120,"constitution":28,"counterattack":0.4}},{"c":"CopperArmor","n":"Copper Armor","t":"Heavy Armor","d":"A heavy armor made of copper held together with leather straps.","p":20,"s":{"maxHp":30,"constitution":1}},{"c":"DreamwroughtArmor","n":"Dreamwrought Armor","t":"Heavy Armor","d":"Heavy armor made from a metal dreamt by a powerful being. Its ethereal nature makes it less hard than its alternatives, but allows far more mobility.","p":1245,"s":{"maxHp":338,"constitution":26}},{"c":"DuelistArmor","n":"Duelist Armor","t":"Heavy Armor","d":"Living armor in a synchronic communication with the wearer's mind, greatly enhancing their reaction times.","e":"25% counterattack","p":3885,"s":{"maxHp":75,"constitution":20,"counterattack":0.25}},{"c":"FleetfootArmor","n":"Fleetfoot Armor","t":"Heavy Armor","d":"Heavy armor padded with a textile material that can magically reduce the wearer weight, enhancing its agility.","e":"+12% dodge (additive)","p":1251,"s":{"flatDodgeChance":0.12,"maxHp":240,"constitution":5,"dexterity":1}},{"c":"FrostmetalArmor","n":"Frostmetal Armor","t":"Heavy Armor","d":"The hardest frostmetal coupled with trollskin paddings give this armor an extreme durability, while gifting the wearer with an increased regeneration.","e":"Regeneration 6","p":504,"s":{"maxHp":180,"constitution":5,"regeneration":6}},{"c":"FrozenEmbrace","n":"Frozen Embrace","t":"Heavy Armor","d":"Enhanced with powerful ice magic, every attacker who touch this armor will be feeling its freezing nature.\nFREEZE: This unit can't dodge and takes 10 physical damage each turn.","e":"FREEZES melee attackers","p":2457,"s":{"onSelfHit":2457,"maxHp":200,"defense":12}},{"c":"GhastlyCuirass","n":"Ghastly Cuirass","t":"Heavy Armor","d":"Heavy chest armor infused with an otherworldly substance, able to attract the enemies attention.","e":"Threat level +1","p":1686,"s":{"maxHp":90,"constitution":6,"magicDefense":10,"threat":1}},{"c":"GoldenArmor","n":"Golden Armor","t":"Heavy Armor","d":"Standard, high quality equipment issued to the Empire Army soldiers.","p":552,"s":{"maxHp":120,"constitution":4}},{"c":"IceCage","n":"Ice Cage","t":"Heavy Armor","d":"Incredibly hard and cold armor enhanced with rare reagents from the coldest mountains of the Realm. Will FREEZE attackers on contact.\nFREEZE: This unit can't dodge and takes 10 physical damage each turn.","e":"FREEZES melee attackers","p":3926,"s":{"onSelfHit":3926,"maxHp":215,"defense":16}},{"c":"IronChainmail","n":"Iron Chainmail","t":"Heavy Armor","d":"Iron rings woven together to confer basic protection in battle.","p":51,"s":{"maxHp":60,"constitution":2}},{"c":"KabelianArmor","n":"Kabelian Armor","t":"Heavy Armor","d":"Armor donned by the leaders of the Crusade from the Eastern Kingdom, radiating light into the darkest corners of the Realms.","e":"-20 darkness","p":3276,"s":{"maxHp":105,"constitution":20,"darknessReduction":20}},{"c":"MetamorphicArmor","n":"Metamorphic Armor","t":"Heavy Armor","d":"Shapeshifting spikes poke out from this armor when needed, orienting themselves towards attackers.","e":"Retaliate 10 (physical)","p":1188,"s":{"maxHp":140,"constitution":5,"retaliationPhysicalDamage":10}},{"c":"NilArmor","n":"Nil Armor","t":"Heavy Armor","d":"An incredibly resistant armor, coated with the flesh of a Slime God. Will grant an unmatched protection to the wearer.","p":57000,"s":{"maxHp":350,"defense":15,"magicDefense":15}},{"c":"ObsidianCuirass","n":"Obsidian Cuirass","t":"Heavy Armor","d":"Very heavy chest armor that grants the wearer with the highest levels of protection.","p":405,"s":{"maxHp":210,"constitution":7}},{"c":"OrichalcumArmor","n":"Orichalcum Armor","t":"Heavy Armor","d":"Incredibly resistant armor made from Orichalcum, an unbreakable metal. While this material offers the best available protection, It may limit the wearer's mobility.","p":2730,"s":{"maxHp":442}},{"c":"PatricianArmor","n":"Patrician Armor","t":"Heavy Armor","d":"A golden armor adorned with the elusive Golden Rabbit fur, worn in social occasions by high ranking generals and diplomats.","e":"+35% experience","p":645,"s":{"maxHp":120,"constitution":4,"bonusExperience":35}},{"c":"PrimevalArmor","n":"Primeval Armor","t":"Heavy Armor","d":"Armor plated with the scales of an enormous behemoth, extremely heavy but capable of withstanding devastating blows.","p":1296,"s":{"maxHp":270,"constitution":9,"defense":15}},{"c":"PrismaticArmor","n":"Prismatic Armor","t":"Heavy Armor","d":"Combines different types of elemental magic to provide an unbreakable defense, while neutering their individual elemental properties.","p":20850,"s":{"maxHp":230,"defense":15,"magicDefense":15}},{"c":"SageArmor","n":"Sage Armor","t":"Heavy Armor","d":"Armor enhanced with a powerful infusion, able to boost the learning ability of the wearer.","e":"+60% experience","p":3915,"s":{"maxHp":210,"constitution":7,"bonusExperience":60}},{"c":"ShieldingCuirass","n":"Shielding Cuirass","t":"Heavy Armor","d":"Heavy armor enhanced with an endless source of magic power, to shield the user from external influences.","e":"30% status immunity","p":1224,"s":{"immunityToStatus":0.3,"maxHp":300,"constitution":15}},{"c":"SlimeArmor","n":"Slime Armor","t":"Heavy Armor","d":"Protective armor made with sticky, green slime that can dissipate the force of any impact, lowering their effectiveness.","p":630,"s":{"maxHp":150,"defense":5}},{"c":"SpikedSkeleton","n":"Spiked Skeleton","t":"Heavy Armor","d":"The skeleton of an undead monster, studded with very sharp spikes.","e":"Retaliate 50 (physical)","p":0,"s":{"retaliationPhysicalDamage":50,"constitution":8}},{"c":"SwarmkeeperArmor","n":"Swarmkeeper Armor","t":"Heavy Armor","d":"An ethereal swarm inhabits this armor, and will chew at the flesh of any enemy getting close enough.","e":"Retaliate 100 (magical)","p":3368,"s":{"retaliationMagicalDamage":100,"maxHp":390,"constitution":13}},{"c":"TortoiseArmor","n":"Tortoise Armor","t":"Heavy Armor","d":"Heavy armor made with the thick, resilient shell of a large tortoise.","p":492,"s":{"maxHp":240,"constitution":8}},{"c":"UndeadCuirass","n":"Undead Cuirass","t":"Heavy Armor","d":"Heavy chest armor made from undead remains.","p":72,"s":{"maxHp":90,"constitution":3}},{"c":"UnholyCuirass","n":"Unholy Cuirass","t":"Heavy Armor","d":"The malignant aura surrounding this armor will harm any enemies daring to enter its range.","e":"Retaliate 15 (magical)","p":1607,"s":{"maxHp":230,"constitution":8,"retaliationMagicalDamage":15}},{"c":"UnholySpellcage","n":"Unholy Spellcage","t":"Heavy Armor","d":"Bound within this ungodly cuirass by a potent spell, the seal of the Ten Hells burns fiercely, swiftly dissolving any foe bold enough to draw near.","e":"Retaliate 60 (magical)","p":3086,"s":{"maxHp":320,"constitution":9,"retaliationMagicalDamage":60}},{"c":"VoidArmor","n":"Void Armor","t":"Heavy Armor","d":"Not fully understood in its properties, adding a void drop to an already stable mixture of elements seems to further enhance their properties, giving life to the hardest material known to exist.","p":31500,"s":{"maxHp":280,"defense":15,"magicDefense":15}},{"c":"AncientRobe","n":"Ancient Robe","t":"Light Armor","d":"Extremely light robe made with the remains of a prehistoric wing.","p":600,"s":{"maxHp":110,"intelligence":33}},{"c":"BreathtakingRobe","n":"Breathtaking Robe","t":"Light Armor","d":"A robe made with the wings of a Giant Moth treated to increase the normal amount of choking powder present by several orders of magnitude. Causes swelling in the airways of enemies getting too close, SILENCING them for 2 turns.\nSILENCE: the unit can't gain any mana","e":"SILENCES melee attackers","p":1859,"s":{"onSelfHit":1859,"maxHp":100,"intelligence":25}},{"c":"ChiefScientistCoat","n":"Chief Scientist Coat","t":"Light Armor","d":"An apparently simple coat that belonged to the brightest mind of Kaunis. It increases the wearer attributes in an unknown way that doesn't rely on magic.","e":"+25% healing","p":17500,"s":{"healingModifier":0.25,"intelligence":72},"o":["Kaunis"]},{"c":"CloakOfRedemption","n":"Cloak of Redemption","t":"Light Armor","d":"An intricate pattern made with magic chains is applied on a fire magic enhancing tunic, embedding the wearer in a protective field that reflects a part of the incoming force.","e":"ABLAZE damage +40%","p":4203,"s":{"onFireBonusDamage":2,"maxHp":110,"defense":20,"magicDefense":10}},{"c":"ClothRobe","n":"Cloth Robe","t":"Light Armor","d":"A light robe made of cloth derived from plants.","p":54,"s":{"maxHp":10,"intelligence":3}},{"c":"DeepSeaRobe","n":"Deep Sea Robe","t":"Light Armor","d":"The velvet infused with deep sea reagents used in the weaving of this robe confers it enhanced protection against external elements.","e":"40% status immunity","p":5505,"s":{"maxHp":50,"intelligence":15,"immunityToStatus":0.4}},{"c":"DreamwroughtRobe","n":"Dreamwrought Robe","t":"Light Armor","d":"An ethereal robe woven from cloth dreamt by an otherworldly being. Sacrifices resistance to grant a better intelligence improvement.","p":690,"s":{"maxHp":46,"intelligence":60}},{"c":"ElasticRobe","n":"Elastic Robe","t":"Light Armor","d":"An unknown light, elastic material sewn in the shape of a robe. Offers great protection, without hindering the wearer mobility, which is vital for spellcasting.","p":444,"s":{"maxHp":90,"intelligence":27}},{"c":"ExoticRobe","n":"Exotic Robe","t":"Light Armor","d":"Woven with Velvet imported by pirates, these robes are sought after by all the mages and nobles in the highest spheres.","p":1350,"s":{"maxHp":50,"intelligence":15}},{"c":"FeatherRobe","n":"Feather Robe","t":"Light Armor","d":"A light robe made of feathers, displaying the color of the desert birds.","p":72,"s":{"maxHp":20,"intelligence":6}},{"c":"FleetfootRobe","n":"Fleetfoot Robe","t":"Light Armor","d":"Light robe made with a textile material that can magically reduce the wearer weight, enhancing its agility.","e":"+24% dodge (additive)","p":1688,"s":{"flatDodgeChance":0.24,"maxHp":80,"intelligence":12,"dexterity":4}},{"c":"GhostRabbitCloak","n":"Ghost Rabbit Cloak","t":"Light Armor","d":"Light cloak made from ghastly fabric mixed with the elusive Golden Rabbit fur.","e":"+35% experience","p":390,"s":{"maxHp":30,"intelligence":9,"bonusExperience":35}},{"c":"KaunianRobe","n":"Kaunian Robe","t":"Light Armor","d":"Extremely resistant robe woven from cloth employed by Kaunis elite troops. Grants increased protection to the wearer, but the lack of magic used in its making will reduce the boost to intelligence.","p":900,"s":{"maxHp":206,"intelligence":20}},{"c":"LaroxianRobe","n":"Laroxian Robe","t":"Light Armor","d":"Light and versatile robe woven from a magic infused cloth produced in Larox.","p":504,"s":{"maxHp":100,"intelligence":30}},{"c":"MothRobe","n":"Moth Robe","t":"Light Armor","d":"Resistant but very light robe made from the wings of a Giant Moth.","p":783,"s":{"maxHp":80,"intelligence":24}},  robe allows to apply different enchantments during its crafting, since protection from it's own fiery power is no longer needed.","e":"ABLAZE damage +40%","p":7205,"s":{"onFireBonusDamage":2,"maxHp":150,"defense":20,"magicDefense":12}},{"c":"WinterCape","n":"Winter Cape","t":"Light Armor","d":"The peculiar properties of the troll's Wintercloth allows to craft this very light albeit resilient light clothing","p":486,"s":{"maxHp":60,"intelligence":18}},{"c":"WyvernCape","n":"Wyvern Cape","t":"Light Armor","d":"Enhanced with real Snow Wyvern scales, this robe allows for an enhanced channeling of white magic.","e":"+15% healing","p":630,"s":{"maxHp":80,"intelligence":15,"healingModifier":0.15}},{"c":"AbherrantFabric","n":"Aberrant Fabric","t":"Material","d":"A piece of fabric of unknown origin, worn by the members of a cult that wishes for the return of the Ancient.","p":20,"o":["The Lost Expedition"]},{"c":"AbioticCore","n":"Abiotic Core","t":"Material","d":"An artificial mechanism that can control an organic brain, amplifying its capabilities enough to manipulate the physical world that surrounds it.","p":2000,"o":["Kaunis"]},{"c":"AbyssalGoo","n":"Abyssal Goo","t":"Material","d":"Viscous potion that can enhance some base materials with additional, terrifying properties.","p":1193},{"c":"AbyssalIngot","n":"Abyssal Ingot","t":"Material","d":"A black Iron ingot blessed with eldritch properties from the depth of the abyss.","p":1811},{"c":"AbyssalSeashell","n":"Abyssal Seashell","t":"Material","d":"Large seashell found in the north-western seas. Mostly used as decoration, possesses some interesting properties.","p":12,"o":["Blackwater Port"]},{"c":"AetherIgnis","n":"Aether Ignis","t":"Material","d":"Flammable liquid used to make flight possible for the heavy flying ships of the Celestial Army.","p":19,"o":["Celestial Mothership"]},{"c":"AlchemicPowder","n":"Alchemic Powder","t":"Material","d":"The mysterious substance responsible of infusing life into the titans roaming the cultists lair. The origin seems organic.","p":100,"o":["The Cultist Rebels"]},{"c":"AlphaWolfFang","n":"Alpha Wolf Fang","t":"Material","d":"A partitularly long tooth, once belonging to the leader of a pack of wolves.","p":5,"o":["Enchanted Forest"]},{"c":"AncestralBlood","n":"Ancestral Blood","t":"Material","d":"Blood drawn from Lazarus, the first vampire.","p":1000,"o":["The Tower"]},{"c":"AncientHide","n":"Ancient Hide","t":"Material","d":"Scale covered hide of a giant, archaic beast living at the center of the world.","p":2,"o":["Lost Lands"]},{"c":"AncientMembrane","n":"Ancient Membrane","t":"Material","d":"An incredibly durable yet lightweight membrane, taken from the wing of a creature believed to have gone extinct millions of years ago.","p":2,"o":["Lost Lands"]},{"c":"AncientSeed","n":"Ancient Seed","t":"Material","d":"A hardened, very old seed that seems to possess magical properties.","p":20,"o":["Enchanted Forest"]},{"c":"AnimatedIngot","n":"Animated Ingot","t":"Material","d":"Metal ingot smelted from pieces of Living Metal.","p":9},{"c":"AnimatedScraps","n":"Animated Scraps","t":"Material","d":"Pieces of an unknown metal. They move erratically when left alone, and pulsate with an eerie light.","p":2,"o":["Hidden City of Larox"]},{"c":"AstralGoo","n":"Astral Goo","t":"Material","d":"A chunk of a giant, nightmarish monster that surpasses a mortal's wildest fantasy. You are not sure of its utility.","p":4,"o":["The Lost Expedition"]},{"c":"BagOfChokingPowder","n":"Bag of Choking Powder","t":"Material","d":"A bag of irritant powder that Giant Moth wings are covered in. It allows for a more aerodynamic flight, but irritates the airways of most other living beings.","p":38,"o":["The Southern Grove"]},{"c":"BansheeClaw","n":"Banshee Claw","t":"Material","d":"The sharp and resilient claw of a Banshee","p":38,"o":["Barren Wastelands"]},{"c":"BansheeHorn","n":"Banshee Horn","t":"Material","d":"Twisted, black horn of a Banshee","p":95,"o":["Barren Wastelands"]},{"c":"BansheeScale","n":"Banshee Scale","t":"Material","d":"Hard scale making up the skin of a Banshee","p":3,"o":["Barren Wastelands"]},{"c":"BatTooth","n":"Bat Tooth","t":"Material","d":"Frontal tooth of a Vampire Bat. Sometimes used as alchemic ingredient.","p":2,"o":["Obsidian Mines"]},{"c":"BatWing","n":"Bat Wing","t":"Material","d":"The resilient wing of a Vampire Bat.","p":3,"o":["Obsidian Mines"]},{"c":"BeastPelt","n":"Beast Pelt","t":"Material","d":"The pelt of a wild animals, usually refined to make Leather.","p":1,"o":["Enchanted Forest"]},{"c":"BlackHide","n":"Black Hide","t":"Material","d":"The skin of a horrible monster preying in the dark.","p":16,"o":["The Lost Expedition"]},{"c":"BlackIronIngot","n":"Black Iron Ingot","t":"Material","d":"Extremely resistant metal alloy. It's formula is jealously guarded by the pirate blacksmiths.","p":14},{"c":"BlackIronScraps","n":"Black Iron Scraps","t":"Material","d":"Scraps of the famed metal, ready to be fused into an ingot.","p":3,"o":["Blackwater Port"]},{"c":"BlackOoze","n":"Black Ooze","t":"Material","d":"A dense, sticky black substance. It is believed to be a byproduct of the soul-stealing process from the eldritch gods.","p":3,"o":["Imperial Rescue"]},{"c":"BoarTusk","n":"Boar Tusk","t":"Material","d":"A well preserved tusk from a wild boar.","p":2,"o":["Enchanted Forest"]},{"c":"BoneFragment","n":"Bone Fragment","t":"Material","d":"Fragments of a bone once belonging to a valiant soldier.","p":1,"o":["Ancient Grave Digging"]},{"c":"BottledSandSpirit","n":"Bottled Sand Spirit","t":"Material","d":"A powerful Djinn spirit trapped in a bottle.","p":110,"o":["The Desert"]},{"c":"CelestialMetal","n":"Celestial Metal","t":"Material","d":"An ingot made from recovered scraps.","p":9},{"c":"CelestialScraps","n":"Celestial Scraps","t":"Material","d":"Hard metal with an impossibly high fusion point. Must be some kind of alloy made with unknown ingredients.","p":2,"o":["Celestial Mothership"]},{"c":"ChainLink","n": rew","n":"Crimson Brew","t":"Material","d":"A thick potion displaying a vivid red color.","p":360},{"c":"CrusaderInsigna","n":"Crusader Insigna","t":"Material","d":"The woven seal of the Crusaders of the Eastern Kingdom. A symbol of hope for their people, heralding light in their darkest moments.","p":52,"o":["The Cultist Rebels"]},{"c":"CursedSilver","n":"Cursed Silver","t":"Material","d":"An extremely light chunk of silver that glows with an eerie light.","p":160,"o":["Ancient Grave Digging"]},{"c":"DeepSeaVelvet","n":"Deep Sea Velvet","t":"Material","d":"A piece of Exotic Velvet blessed with eldritch properties from the depth of the abyss.","p":1835},{"c":"Diamond","n":"Diamond","t":"Material","d":"A very hard gem that appears to be impossible to scratch. Only a handful of these have ever been found on the surface, making it an ideal gift for powerful kings or emperors.","p":5000,"o":["Lost Lands"]},{"c":"DreamwroughtHide","n":"Dreamwrought Hide","t":"Material","d":"Hide fetched from a dangerous, colossal dream creature. Due to its origin it is very versatile, but less resistant.","p":25,"o":["Sleeping Planet"]},{"c":"DreamwroughtLarva","n":"Dreamwrought Larva","t":"Material","d":"The first stage of development of an insect materialized from a dream.","p":50,"o":["Sleeping Planet"]},{"c":"DreamwroughtMane","n":"Dreamwrought Mane","t":"Material","d":"The thick mane of a Dreamwrought Beast.","p":5,"o":["Sleeping Planet"]},{"c":"DreamwroughtSilk","n":"Dreamwrought Silk","t":"Material","d":"Extremely flexible cloth woven from a dream like thread. Due to its origin it is very versatile, but less resistant.","p":23},{"c":"DreamwroughtSteel","n":"Dreamwrought Steel","t":"Material","d":"Very malleable metal materialized from a dream by an expert blacksmith. Due to its origin it is very versatile, but less resistant.","p":85,"o":["Sleeping Planet"]},{"c":"ElasticMembrane","n":"Elastic Membrane","t":"Material","d":"A sheath of a weird material that could be either natural or artificial.","p":2,"o":["Celestial Mothership"]},{"c":"EldritchSeal","n":"Eldritch Seal","t":"Material","d":"The Seal of the Outer God, worn by his priests to show their unwavering faith.","p":893},{"c":"EldritchShred","n":"Eldritch Shred","t":"Material","d":"A fragment of a larger tapestry, it can be combined with other pieces to reveal the complete picture.","p":85,"o":["The Lost Expedition"]},{"c":"EldritchTendril","n":"Eldritch Tendril","t":"Material","d":"One of the tendrils of a Beholder. You can feel its powerful magic still flowing into the appendage.","p":8,"o":["Obsidian Mines"]},{"c":"ElectricCatalyst","n":"Electric Catalyst","t":"Material","d":"Arcane catalyst used to balance the properties of powerful, unstable elements.","p":173},{"c":"ElixirOfAffinity","n":"Elixir of Affinity","t":"Material","d":"Very difficult to brew even for the most skilled alchemists, made from ingredients of legendary rarity, this elixir acts as a neutral glue for substances that would otherwise reject each other.","p":1233},{"c":"ElixirOfLearning","n":"Elixir of Learning","t":"Material","d":"Magic concoction that briefly boosts the ability of a student to learn new concepts.","p":65,"o":["The Cultist Rebels"]},{"c":"ElongatedBone","n":"Elongated Bone","t":"Material","d":"An unusually long bone, probably coming from a hind leg of a war hound.","p":6,"o":["Ancient Grave Digging"]},{"c":"ElysianWood","n":"Elysian Wood","t":"Material","d":"An extremely rare wood found in a minority of trees in the Southern Lands. Seems to keep sprouting new branches even when chopped off the original tree.","p":2,"o":["The Southern Grove"]},{"c":"Emerald","n":"Emerald","t":"Material","d":"Precious green gemstone, widely employed in the field of jewelry.","p":70,"o":["Imperial Rescue"]},{"c":"EssenceOfCorruption","n":"Essence of Corruption","t":"Material","d":"Pitch black potion distilled from the Black Ooze. When purified through additional steps, it can manifest unique properties.","p":180},{"c":"ExaltedPowder","n":"Exalted Powder","t":"Material","d":"Alchemic powder enriched to display new magical properties. Only this powder is pure enough to be merged with the Primordial, increasing its strength.","p":5000,"o":["The Cultist Rebels"]},{"c":"ExoticVelvet","n":"Exotic Velvet","t":"Material","d":"Very smooth and prestigious textile imported by pirates from distant lands.","p":30,"o":["Blackwater Port"]},{"c":"EyeOfTheAbyss","n":"Eye of the Abyss","t":"Material","d":"Seeing its dimensions makes you wonder what kind of monsters lurk in the ocean's depth. Powerful and very rare alchemic ingredient.","p":75,"o":["Blackwater Port"]},{"c":"EyesOfTheSwordsman","n":"Eyes of the Swordsman","t":"Material","d":"The eyes of the first general of the Sha'huri Army. A unique battle trophy.","p":5000,"s":{"notSellable":true},"o":["Divine Archeology"]},{"c":"Feather","n":"Feather","t":"Material","d":"A very light feather with a variety of uses.","p":2,"o":["The Desert"]},{"c":"FireCatalyst","n":"Fire Catalyst","t":"Material","d":"Arcane catalyst used to balance the properties of powerful, unstable elements.","p":173},{"c":"FireproofOil","n":"Fireproof Oil","t":"Material","d":"An oil obtained through unknown means that allow anything covered in it to be immune to fire.","p":100,"o":["Kaunis"]},{"c":"FlakeOfInfinity","n":"Flake of Infinity","t":"Material","d":"A piece of an incredibly powerful being, that somehow crossed the threshold between the mortal world and something else.","p":250,"o":["Sleeping Planet"]},{"c":"FleetfootFabric","n":"Fleetfoot Fabric","t":"Material","d":"A magic textile enchanted by unknown rituals. Grants the wearer a reduction in its weight.","p":9,"o":["The Southern Grove"]},{"c":"FluxLimiter","n":"Flux Limiter","t":"Material","d":"An organic mass of nerves and tendrils, shaped to have specific optic properties.","p":38,"o":["Celestial Mothership"]},{"c":"FrostCrystal","n":"Frost Crystal","t":"Material","d":"An extremely sharp crystal displaying minor magical properties. Despite its nature, it never melts.","p":16,"o":["Frostbite Peaks"]},{"c":"FrostNucleus","n":"Frost Nucleus","t":"Material","d":"The magic pebble around which an Ice Elemental can form.","p":80,"o":["Frostbite Peaks"]},{"c":"FrostmetalIngot","n":"Frostmetal Ingot","t":"Material","d":"An ingot of a peculiar type of metal that mixes the properties of iron and ice.","p":18},{"c":"FrostmetalOre","n":"Frostmetal Ore","t":"Material","d":"A raw piece of very strong and cold metal. Can be smelted into ingots.","p":4,"o":["Frostbite Peaks"]},{"c":"FrozenEgg","n":"Frozen Egg","t":"Material","d":"The egg of a Snow Wyvern. It's unique properties seem to increase the danger cold weather poses to those around it.","p":160,"o":["Frostbite Peaks"]},{"c":"FrozenScale","n":"Frozen Scale","t":"Material","d":"A scale of the fearsome Snow Wyvern. Always a few degrees lower than room temperature.","p":16,"o":["Frostbite Peaks"]},{"c":"GemOfProtection","n":"Gem of Protection","t":"Material","d":"Stabilized gem that projects a force field, adding a layer of protection on the owner.","p":60},{"c":"GhostwoodBoard","n":"Ghostwood Board","t":"Material","d":"Board of Ghostwood ready to be employed for the creation of various equipments.","p":9,"o":["Blackwater Port"]},{"c":"GhostwoodStump","n":"Ghostwood Stump","t":"Material","d":"Ghostwood replacement for a lost leg, a common occurrence in the pirate's world.","p":2,"o":["Blackwater Port"]},{"c":"GiantMothWing","n":"Giant Moth Wing","t":"Material","d":"A moth wing of unusual dimensions, possesses greater elasticity than its smaller counterparts.","p":3,"o":["The Southern Grove"]},{"c":"GiantShellFragment","n":"Giant Shell Fragment","t":"Material","d":"A piece of an extremely hard shell.","p":2,"o":["The Southern Grove"]},{"c":"GiftOfLight","n":"Gift of Light","t":"Material","d":"A mysterious reagent gifted by a god of light.","p":1250,"o":["The Tower"]},{"c":"Glass","n":"Glass","t":"Material","d":"Sand heated to form transparent, smooth surface.","p":8},{"c":"GoldIngot","n":"Gold Ingot","t":"Material","d":"A precious metal widely employed in the production of high-grade military equipment for the Imperial Army.","p":23},{"c":"GoldScraps","n":"Gold Scraps","t":"Material","d":"Scraps of gold retrieved from broken equipment. Can be smelted into ingot.","p":5,"o":["Imperial Rescue"]},{"c":"GreenSlime","n":"Green Slime","t":"Material","d":"Green, transparent jelly that makes up the body of Slimes.","p":3,"o":["The Slime Pond"]},{"c":"HeartOfDarkness","n":"Heart of Darkness","t":"Material","d":"The heart of a being predating existence itself. An expression of hatred unmatched by anything else.","p":1500,"o":["The Tower"]},{"c":"HolyWater","n":"Holy Water","t":"Material","d":"Water blessed with a secret ritual by a bishop of the capital. Can be used to remove curses from items or living creatures, but due to the length of the rituals involved in its production only the most wealthy individuals can afford it.","p":70,"o":["The Golden City"]},{"c":"IceCatalyst","n":"Ice Catalyst","t":"Material","d":"Arcane catalyst used to balance the properties of powerful, unstable elements.","p":212},{"c":"IceFiber","n":"Ice Fiber","t":"Material","d":"A thin thread of ice-like textile, likely made with a technique only known to the Trolls.","p":3,"o":["Frostbite Peaks"]},{"c":"InfectedBlood","n":"Infected Blood","t":"Material","d":"Blood carrying the mysterious infection that can turn regular undead into ghouls. Can be used as alchemic ingredient.","p":13,"o":["Eternal Battlefield"]},{"c":"Infernite","n":"Infernite","t":"Material","d":"Mysterious mineral forged by the hottest fire, remarkably resistant yet light as a feather. Oddly cold at touch, allows to forge items with impossible aerodynamics, not reproducible with any other means.","p":125,"o":["Lost Lands"]},{"c":"InfusionOfWisdom","n":"Infusion of Wisdom","t":"Material","d":"An oil that can be applied to certain armors or garments, able to boost the learning speed of those who wear it.","p":1965},{"c":"IronIngot","n":"Iron Ingot","t":"Material","d":"A durable and resistant metal, usually employed to craft battle armaments.","p":5},{"c":"Ivory","n":"Ivory","t":"Material","d":"Smooth, pale white material derived from tusks of animals.","p":28,"o":["Imperial Rescue"]},{"c":"KabelianMetal","n":"Kabelian Metal","t":"Material","d":"Rare metal from the eastern lands. Displays some unique properties, likely coming from the psyonic ability of the people who smelted it.","p":80,"o":["The Cultist Rebels"]},{"c":"KaunianFabric","n":"Kaunian Fabric","t":"Material","d":"Thick and hard fabric displaying properties more close to those found in metal. Doesn't display any magical property, but will do an excellent job in protecting its owner.","p":25,"o":["Kaunis"]},{"c":"Kindlequartz","n":"Kindlequartz","t":"Material","d":"Cold at touch, this peculiar gem reflects light with a flame-like shimmer. Seems to draw the curiosity of the nearby wildlife.","p":220,"o":["Lost Lands"]},{"c":"LargeIris","n":"Large Iris","t":"Material","d":"An intact eye of a slain Beholder. Can be used as a perfectly focused magic lens.","p":17,"o":["Obsidian Mines"]},{"c":"LaroxianFabric","n":"Laroxian Fabric","t":"Material","d":"An incredibly resistant but light fabric, enchanted with a variety of spells to enhance its properties.","p":2,"o":["Hidden City of Larox"]},{"c":"Leather","n":"Leather","t":"Material","d":"A resistant but light material, usually employed in the making of armors or armor paddings.","p":3},{"c":"LivingSap","n":"Living Sap","t":"Material","d":"The sap from a living tree.","p":10,"o":["Enchanted Forest"]},{"c":"LivingVine","n":"Living Vine","t":"Material","d":"A long, resistant vine ripped from an ancient tree that moves on its own volition.","p":18,"o":["The Southern Grove"]},{"c":"LongSerpentFang","n":"Long Serpent Fang","t":"Material","d":"A very long and sharp fang taken from a wild Spitfang.","p":36,"o":["The Southern Grove"]},{"c":"MetamorphicSand","n":"Metamorphic Sand","t":"Material","d":"Looks like regular sand at first glance, but displays peculiar shapeshifting properties.","p":2,"o":["Divine Archeology"]},{"c":"MissingPage","n":"Missing Page","t":"Material","d":"A single page of some old book.","p":5,"o":["Blackwater Port"]},{"c":"Mithril","n":"Mithril","t":"Material","d":"A legendary alloy, unbreakable by traditional means. Its creation remains a guarded secret of the dwellers of the Forgotten Lands.","p":4,"o":["Lost Lands"]},{"c":"MonkeyHide","n":"Monkey Hide","t":"Material","d":"The hide of a Capuchin Monkey, a small primate usually kept as pet and assistant by some Skull Island pirates.","p":3,"o":["Blackwater Port"]},{"c":"MutantHide","n":"Mutant Hide","t":"Material","d":"Extremely thick skin from a creature mutated through horrifying experiments. Hard to adapt to the human body, but impenetrable with conventional weapons.","p":55,"o":["Kaunis"]},{"c":"MysteriousAppendage","n":"Mysterious Appendage","t":"Material","d":"The viscid limb taken from a deep sea monster.","p":15,"o":["Blackwater Port"]},{"c":"MysteriousCog","n":"Mysterious Cog","t":"Material","d":"A simple brass cog. No one knoes its exact function, or can explain the immense power it contains.","p":2000,"o":["The Tower"]},{"c":"NightwingLeather","n":"Nightwing Leather","t":"Material","d":"High end leather sought after in all the Realms. Retrieving this material is so dangerous that only few people have ever owned it.","p":9},{"c":"ObsidianChunk","n":"Obsidian Chunk","t":"Material","d":"Dark, reflective stone famous for its durability, and sharpness when broken into pieces.","p":3,"o":["The Lost Expedition"]},{"c":"OrbOfEctoplasm","n":"Orb of Ectoplasm","t":"Material","d":"An orb of otherworldly matter, stirring upon itself in an endless dance.","p":50,"o":["Eternal Battlefield"]},{"c":"OrichalcumIngot","n":"Orichalcum Ingot","t":"Material","d":"Unbreakable metal from another world. Sacrifices malleability to increase its resistance.","p":30},{"c":"OrichalcumScraps","n":"Orichalcum Scraps","t":"Material","d":"Pieces of an unbreakable metal that can be melted into ingots.","p":5,"o":["Kaunis"]},{"c":"Pearl","n":"Pearl","t":"Material","d":"Perfectly round and with a smooth surface. Very prized material for jewelers.","p":100,"o":["Blackwater Port"]},{"c":"PermafrostCore","n":"Permafrost Core","t":"Material","d":"Unstable core that instantly freezes everything around it.","p":50,"o":["The Slime Pond"]},{"c":"PermafrostEssence","n":"Permafrost Essence","t":"Material","d":"Stabilized Permafrost Core, can be used to craft powerful items.","p":1008},{"c":"PhoenixFeather","n":"Phoenix Feather","t":"Material","d":"A feather plucked from the mythical Phoenix.","p":825,"o":["The Tower"]},{"c":"PhylacteryFragment","n":"Phylactery Fragment","t":"Material","d":"Fragment of a powerful artifact. Has something to do with death-altering magic.","p":450,"o":["Ancient Grave Digging"]},{"c":"PlantFiber","n":"Plant Fiber","t":"Material","d":"A base ingredient used in the production of textiles.","p":2,"o":["Enchanted Forest"]},{"c":"PoisonousFlesh","n":"Poisonous Flesh","t":"Material","d":"The flesh of a mushroom that lives deep underground. It contains a strange poison with a paralyzing effect, and requires careful handling.","p":42,"o":["Lost Lands"]},{"c":"PrehistoricMixture","n":"Prehistoric Mixture","t":"Material","d":"A strange amalgam of ingredients from the depths of the Forgotten Lands, seamlessly fused together and exhibiting unique catalytic properties.","p":315,"o":["Lost Lands"]},{"c":"PrimevalScale","n":"Primeval Scale","t":"Material","d":"The enormous scale making up the armor of a colossal Wurm roaming below the Southern Grove.","p":90,"o":["The Southern Grove"]},{"c":"PrimordialEssence","n":"Primordial Essence","t":"Material","d":"The essence of a primordial being, commonly used as alchemic ingredient.","p":30,"o":["Enchanted Forest"]},{"c":"PrismaticEssence","n":"Prismatic Essence","t":"Material","d":"Stabilized essence displaying a variety of colors, elementally neutral but radiating pure arcane energy.","p":13000},{"c":"PterodactylClaw","n":"Pterodactyl Claw","t":"Material","d":"Giant claw of a flying monster previously thought to be extinct.","p":42,"o":["Lost Lands"]},{"c":"Quartz","n":"Quartz","t":"Material","d":"Hard, crystalline mineral found rarely in the deserts and prized for its beauty.","p":5,"o":["Divine Archeology"]},{"c":"RadiatingNucleus","n":"Radiating Nucleus","t":"Material","d":"A powerful, magical device that can store an immense amount of energy. Serves as an engine for Laroxian constructs.","p":10,"o":["Hidden City of Larox"]},{"c":"RecurveBlade","n":"Recurve Blade","t":"Material","d":"A peculiar recurve blade. Unusable in the current state as it's handle is missing.","p":5,"o":["Divine Archeology"]},{"c":"Redwood","n":"Redwood","t":"Material","d":"Peculiar wood from the far east, rarely found in trading points thanks to traveling merchants. Displays a characteristic red shade.","p":2,"o":["Imperial Rescue"]},{"c":"Ruby","n":"Ruby","t":"Material","d":"Deep red gemstone with a rich allure, and used to craft a wide range of jewels","p":70,"o":["Imperial Rescue"]},{"c":"RuneOfPower","n":"Rune of Power","t":"Material","d":"Rune carefully engraved with great mastery into a simple rock, capable of increasing the power of a wizard by orders of magnitude.","p":100,"o":["Hidden City of Larox"]},{"c":"Sandstone","n":"Sandstone","t":"Material","d":"A stone made of sand solidified into a stone-like block.","p":1,"o":["The Desert"]},{"c":"Scanner","n":"Scanner","t":"Material","d":"An unknown device made of flesh, metal and stone. Seems capable to detect movement without relying on light.","p":90,"o":["Celestial Mothership"]},{"c":"ScarletStrand","n":"Scarlet Strand","t":"Material","d":"Gift from an ancient divine force to its worshippers. Only a few exemplars are known to exist, and their strength and quality is legendary.","p":20000},{"c":"ScrapMetal","n":"Scrap Metal","t":"Material","d":"Pieces of metal that usually comes from broken battle gear. Can be smelted into ingots and recycled.","p":1,"o":["Divine Archeology"]},{"c":"SealOfClaris","n":"Seal of Claris","t":"Material","d":"Magic seal of Claris, the rebel Cultist.","p":6500,"o":["The Cultist Rebels"]},{"c":"SentientSlab","n":"Sentient Slab","t":"Material","d":"A stone slab from one of the titans created in secret with a cursed ritual.","p":150,"o":["The Cultist Rebels"]},{"c":"ShadowGem","n":"Shadow Gem","t":"Material","d":"When a living being touches this gem, whatever their nature is, they are instantly drawn to darkness.","p":34,"o":["The Lost Expedition"]},{"c":"ShadowPotion","n":"Shadow Potion","t":"Material","d":"With a bright purple color, items can be infused to provide bonuses in dark areas.","p":591},{"c":"ShahuriBowFrame","n":"Sha'huri Bow Frame","t":"Material","d":"The bow frame used to make the renowned Sha'huri bows.","p":55,"o":["Divine Archeology"]},{"c":"SharpRib","n":"Sharp Rib","t":"Material","d":"A rib ripped from an undead soldier. It's well conserved and very sharp.","p":6,"o":["Ancient Grave Digging"]},{"c":"SilkFabric","n":"Silk Fabric","t":"Material","d":"Luxurious, smooth fabric prized for its softness and sheen. Used to craft superior light clothing.","p":12},{"c":"SilkThread","n":"Silk Thread","t":"Material","d":"Delicate fiber used to weave the fabric of the same name.","p":2,"o":["Imperial Rescue"]},{"c":"SinisterStabilizer","n":"Sinister Stabilizer","t":"Material","d":"A powerful catalyst used to clear the arcane properties of powerful artifacts that may be cursed, or magically bound to another entity.","p":885},{"c":"SoulShard","n":"Soul Shard","t":"Material","d":"Condensed fragment of the multitude of souls, crystallized inside the creature they inhabited.","p":100,"o":["Ancient Grave Digging"]},{"c":"SpectralCloth","n":"Spectral Cloth","t":"Material","d":"Otherworldly textile made with a glowing thread. Clearly not crafted by human hands.","p":6,"o":["Eternal Battlefield"]},{"c":"SpellwovenHide","n":"Spellwoven Hide","t":"Material","d":"Skin of a creature conjured through a spell, persisting in this world after its defeat.","p":2,"o":["Hidden City of Larox"]},{"c":"SpellwovenLeather","n":"Spellwoven Leather","t":"Material","d":"Leather made from the skin of a creature summoned through magical means.","p":6},{"c":"SpiderLeg","n":"Spider Leg","t":"Material","d":"Leg of a Giant Spider. Can be used as alchemic ingredient.","p":2,"o":["Obsidian Mines"]},{"c":"SpiderSilk","n":"Spider Silk","t":"Material","d":"Made from an almost indestructible thread, this light material offers protection with minimal hindrance to one's movements.","p":18},{"c":"SpiritCandle","n":"Spirit Candle","t":"Material","d":"A magic candle of mysterious origin. It never burns out, and cannot be extinguished with any known mean.","p":20,"o":["Eternal Battlefield"]},{"c":"SpitfangScale","n":"Spitfang Scale","t":"Material","d":"Light and resilient scale making up the skin of a Spitfang.","p":1,"o":["The Southern Grove"]},{"c":"StarFragment","n":"Star Fragment","t":"Material","d":"A fragment of a distant star, containing an immense amount of power.","p":500,"o":["The Lost Expedition"]},{"c":"StaticCore","n":"Static Core","t":"Material","d":"Unstable core displaying an extremely strong electric field.","p":50,"o":["The Slime Pond"]},{"c":"StaticEssence","n":"Static Essence","t":"Material","d":"Stabilized Static Core, can be used to craft powerful items.","p":950},{"c":"SunfireCore","n":"Sunfire Core","t":"Material","d":"Unstable core burning with the power of a small sun.","p":50,"o":["The Slime Pond"]},{"c":"SunfireEssence","n":"Sunfire Essence","t":"Material","d":"Stabilized Sunfire Core, can be used to craft powerful items.","p":950},{"c":"Synapse","n":"Synapse","t":"Material","d":"A small wire capable of conducting electric and thermal energy extremely well.","p":48,"o":["Celestial Mothership"]},{"c":"TatteredHide","n":"Tattered Hide","t":"Material","d":"The decomposed hide of an undead war beast.","p":2,"o":["Ancient Grave Digging"]},{"c":"TerrorsaurusFang","n":"Terrorsaurus Fang","t":"Material","d":"Giant tooth of a voracious creature found in the depth of the world.","p":42,"o":["Lost Lands"]},{"c":"ThaumaturgicBlood","n":"Thaumaturgic Blood","t":"Material","d":"Once infected blood drawn from a fearsome ghoul, it has been purified by a powerful reagent. Unlike the base ingredient, it displays powerful healing properties.","p":89},{"c":"TortoiseThorn","n":"Tortoise Thorn","t":"Material","d":"A very sharp thorn broken off a Giant Tortoise shell.","p":18,"o":["The Southern Grove"]},{"c":"TrollHide","n":"Troll Hide","t":"Material","d":"Hard as a stone but light as regular leather. Used to craft superior quality equipment.","p":2,"o":["Frostbite Peaks"]},{"c":"UnholyPotion","n":"Unholy Potion","t":"Material","d":"All living beings are naturally repelled by its smell. The antithesis of all that is good, conveniently condensed in liquid form.","p":666},{"c":"UnstableGem","n":"Unstable Gem","t":"Material","d":"A gem that vibrates in its own magical frequency. These are the building blocks of the immense Laroxian Nexus, and will one day be correctly attuned and integrated into its design to amplify its power.","p":10,"o":["Hidden City of Larox"]},{"c":"VeilBreaker","n":"Veil Breaker","t":"Material","d":"A staple tool in the bag of the arcane engineer. Allows workers without the gift of magic to manually operate across the veil that separates the physical world from the Arcane Flow.","p":20,"o":["Hidden City of Larox"]},{"c":"VeilShatterer","n":"Veil Shatterer","t":"Material","d":"An extraordinarily powerful magical artifact, capable of overcoming any opposing magical force. It is the only known way to directly interact with the Nexus Core.","p":90},{"c":"VoidCore","n":"Void Core","t":"Material","d":"Unstable core surrounded by a void area where no regular matter can exist.","p":200,"o":["The Slime Pond"]},{"c":"VoodooDoll","n":"Voodoo Doll","t":"Material","d":"Permeated with an ancient, despicable magic, in the right hands this simple cloth doll could inflict unimaginable suffering to an unaware victim.","p":84,"o":["Obsidian Mines"]},{"c":"WardenBelt","n":"Warden Belt","t":"Material","d":"Hard leather belt characterizing the outfit of the wardens of the Golden City.","p":7,"o":["Imperial Rescue"]},{"c":"WarlordSkull","n":"Warlord Skull","t":"Material","d":"An intact skull of a renowned soldier, once leading it's ranks against the enemy.","p":26,"o":["Ancient Grave Digging"]},{"c":"WerewolfFang","n":"Werewolf Fang","t":"Material","d":"Something is really wrong with this tooth…","p":24,"o":["Enchanted Forest"]},{"c":"WhiteHair","n":"White Hair","t":"Material","d":"A single, immaculate white hair.","p":90,"o":["The Southern Grove"]},{"c":"WhiteSlime","n":"White Slime","t":"Material","d":"A white blob taken from the body of a one of a kind slime deity.","p":650,"o":["The Tower"]},{"c":"WickedSeal","n":"Wicked Seal","t":"Material","d":"እንደ ላይ እንደ ታች። አሥርቱ ገሃነሞች እንደገና ተከፍተው ይሆናል፣ በመሠዊያችንም እንደ ሁሉም ይበላሉ።","p":250,"o":["Hidden City of Larox"]},{"c":"WingFabric","n":"Wing Fabric","t":"Material","d":"Very light and elastic textile made from the wings of moths.","p":18},{"c":"Wintercloth","n":"Wintercloth","t":"Material","d":"Despite being a very thin cloth, it isolates almost perfectly from the external cold.","p":18},{"c":"Winterwood","n":"Winterwood","t":"Material","d":"Very sturdy wood from the only tree that can grow in sub-zero temperatures, the Winter Tree.","p":3,"o":["Frostbite Peaks"]},{"c":"Wood","n":"Wood","t":"Material","d":"Just a simple piece of wood.","p":1,"o":["Enchanted Forest"]},{"c":"WurmBlood","n":"Wurm Blood","t":"Material","d":"Blood drawn from a Wurm. Can be used as alchemic ingredient.","p":2,"o":["The Desert"]},{"c":"WurmScale","n":"Wurm Scale","t":"Material","d":"Very hard keratin scales covering the body of the desert Wurms. Can be used as plates to reinforce equipment.","p":1,"o":["The Desert"]},{"c":"AncientJacket","n":"Ancient Jacket","t":"Medium Armor","d":"Extremely versatile jacket made with the remains of prehistoric giants.","p":600,"s":{"maxHp":220,"constitution":11,"dexterity":11}},{"c":"BansheeJacket","n":"Banshee Jacket","t":"Medium Armor","d":"Made of resilient Banshee scales, one of the hardest known organic materials that can bend enough to not reduce the wearer's mobility too much.","p":666,"s":{"maxHp":180,"constitution":9,"dexterity":9}},{"c":"BeastmasterJacket","n":"Beastmaster Jacket","t":"Medium Armor","d":"Elite armor embedding several fiery gems. It has a great versatility in combat, and grants increased control on domesticated creatures. Grants Animal Affinity, which increases the damage of living creatures controlled by 1% for each point.","e":"Animal Affinity: 50","p":2250,"s":{"maxHp":220,"constitution":10,"dexterity":10,"livingCompanionBonusDamage":50}},{"c":"BeltJacket","n":"Belt Jacket","t":"Medium Armor","d":"Crafted from the belts in use by the Golden City Wardens, this equipment is surprisingly resilient despite its improvised nature.","p":312,"s":{"maxHp":80,"constitution":4,"dexterity":4}},{"c":"CottontailJacket","n":"Cottontail Jacket","t":"Medium Armor","d":"Simple jacket padded with the elusive Golden Rabbit fur.","e":"+35% experience","p":345,"s":{"maxHp":20,"constitution":1,"dexterity":1,"bonusExperience":35}},{"c":"CunningDemise","n":"Cunning Demise","t":"Medium Armor","d":"This armor components, harmonized by a central magical seal to build the most disruptive interference, modifies the properties of the air around to make transmission of sound impossible, hindering spellcasters effectiveness.\nSILENCE: the unit can't gain any mana","e":"12.5% SILENCE","p":16200,"s":{"onTargetHit":16200,"maxHp":160,"constitution":7,"dexterity":7}},{"c":"CunningDownfall","n":"Cunning Downfall","t":"Medium Armor","d":"This armor components async function openMain(){try{if(FSA){[S.fh]=await showOpenFilePicker({id:'igm',types:[{description:'Save JSON',accept:{'application/json':['.json']}}]});kv('fh',S.fh);await load()}else{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{const f=i.files[0];if(f){S.fn=f.name;prep(await f.text())}};i.click()}}catch(e){if(e.name!='AbortError')toast(e.message,1)}}
const stale=e=>['NotReadableError','NotFoundError','InvalidStateError'].includes(e.name);
async function refresh(){if(S.dirty&&!confirm('Perubahan yang belum disimpan akan hilang. Lanjutkan?'))return;try{if(FSA&&S.fh){await load();toast('Dimuat ulang dari file')}else openMain()}catch(e){if(stale(e)){toast('Akses file lama hilang, pilih file-nya lagi');S.fh=null;openMain()}else toast(e.message,1)}}
async function pickBackup(){S.bh=await showSaveFilePicker({id:'igmb',suggestedName:'idleguild_save_backup.json',types:[{description:'Backup JSON',accept:{'application/json':['.json']}}]});kv('bh',S.bh)}
const wr=async(h,t)=>{const w=await h.createWritable();await w.write(t);await w.close()};
const dlf=(t,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=n;a.click()};
async function save(){if(!S.d)return toast('Buka file dulu',1);try{const out=JSON.stringify(S.d);
if(FSA&&S.fh){if(!S.bh){toast('Pilih lokasi file backup (sekali saja)');await pickBackup()}
await perm(S.fh);await perm(S.bh);const disk=await(await S.fh.getFile()).text();
try{await wr(S.bh,disk)}catch(e){if(!stale(e))throw e;toast('Lokasi backup lama tidak valid, pilih ulang');await pickBackup();await wr(S.bh,disk)}
await wr(S.fh,out)}
else{dlf(S.raw,'idleguild_save_backup.json');dlf(out,S.fn)}
S.raw=out;S.dirty=0;st();toast('Tersimpan. Backup diperbarui.')}catch(e){toast(e.name=='AbortError'?'Dibatalkan, belum disimpan':stale(e)?'File asli tidak bisa diakses. Tekan Buka, pilih file lagi, lalu ulangi perubahan.':'Gagal: '+e.message,1)}}
const num=(v,a)=>`<input type=number inputmode=numeric ${a} value="${v??0}">`;
function vRes(){return['money','gems'].map(k=>`<div class=card><b>${k=='money'?'Uang':'Gem'} (${k})</b><div class=bar>${num(S.d[k],`data-p=${k}`)}${[1e3,1e6,1e9].map(n=>`<button data-x=add data-v="${k}:${n}">+${n>=1e9?'1B':n>=1e6?'1M':'1K'}</button>`).join('')}</div></div>`).join('')+'<p class=m>Nilai besar bisa merusak save. Naikkan bertahap.</p>'}
function vItems(){const cats=[...new Set(CAT.i.map(x=>x.t))].sort(),c=S.cat;
let h=`<div class=bar><input id=q placeholder="Cari item..." value="${esc(S.q)}"><select id=c><option value="">Semua</option>${cats.map(t=>`<option${t==c?' selected':''}>${t}</option>`).join('')}</select></div><h3>Inventori (${S.d.items.length})</h3>`;
h+=S.d.items.map((it,i)=>[it,i]).filter(([it])=>mt(it.trueClass)&&(!c||(IN.get(it.trueClass)||{}).t==c)).slice(0,80).map(([it,i])=>`<div class=row><span data-x=info data-v="${it.trueClass}">${esc(nm(it.trueClass))}<small>${esc(it.trueClass)}</small></span>${num(it.stack,`data-i=${i}`)}<button class=x data-x=del data-v=${i}>x</button></div>${det(it.trueClass)}`).join('')||'<p class=m>Kosong.</p>';
h+='<h3>Tambah item</h3><p class=m>Ketuk nama item untuk melihat detail.</p>'+CAT.i.filter(x=>(!c||x.t==c)&&mt(x.c)).slice(0,60).map(x=>`<div class=row><span data-x=info data-v="${x.c}">${esc(x.n)}<small>${x.t} - ${x.c}</small></span><input type=number min=1 value=1 id="n_${x.c}"><button data-x=new data-v="${x.c}">+</button></div>${det(x.c)}`).join('');return h}
function advForm(a,i){const f=(p,l,v)=>`<div><label>${l}</label>${num(v,`data-a="${i}|${p}"`)}</div>`;
const sl=Object.keys(SL).map(k=>`<div><label>${k}</label>${slotSel(k,a,i)}</div>`).join('');
const d=a.doctrine||{};const dc=`<div><label>doctrine</label><select data-a="${i}|doctrine.trueClass">${DOC.map(x=>`<option${x==d.trueClass?' selected':''}>${x}</option>`).join('')}</select></div>`+[1,2,3,4,5,6].map(n=>f('doctrine.l'+n,'doctrine l'+n,d['l'+n])).join('');
const pt=Object.entries(a.potionsDrank||{}).map(([k,v])=>f('potionsDrank.'+k,k.replace('potionOf','').replace('Drank',''),v)).join('');
return`<div class=g>${f('level','Level',a.level)}${f('experience','Experience',a.experience)}<div><label>class</label>${clsSel(a.trueClass,i)}</div><div><label>ascended</label><input type=checkbox data-a="${i}|ascended"${a.ascended?' checked':''}></div>${sl}${dc}<div><label>Trait umum</label>${traitSelect(a,i)}</div>${pt}</div><h3>JSON lanjutan</h3><textarea style="height:140px" data-raw=${i}>${esc(JSON.stringify(a))}</textarea><button class=x data-x=adv- data-v=${i}>Hapus karakter</button>`}
function vAdv(){const A=S.d.adventurers;return`<div class=bar><button data-x=adv+>+ Tambah karakter</button></div>`+(A.map((a,i)=>`<div class=card><div class=row data-x=tog data-v=${i}><span><b>${esc(nm(a.trueClass))}</b><small>Lv ${a.level} - id ${a.id}</small></span></div>${S.open==i?advForm(a,i):''}</div>`).join('')||'<p class=m>Belum ada karakter di guild.</p>')+'<p class=m>Class dan perlengkapan yang tidak cocok bisa membuat game crash. Uji dulu dengan backup.</p>'}
function vGuild(){const sk=['money','gems'];return`<div class=bar><input id=q placeholder="Cari pengaturan..." value="${esc(S.q)}"></div><div class=g>`+Object.keys(S.d).filter(k=>!sk.includes(k)&&['number','boolean','string'].includes(typeof S.d[k])&&(!S.q||k.toLowerCase().includes(S.q.toLowerCase()))).sort((a,b)=>(b in MX)-(a in MX)).map(k=>{const v=S.d[k],mx=MX[k];return`<div><label>${k}${mx!=null?` (maks ${mx})`:''}</label>${typeof v=='boolean'?`<input type=checkbox data-p=${k}${v?' checked':''}>`:typeof v=='number'?num(v,`data-p=${k}`+(mx!=null?` data-max=${mx}`:'')):`<input data-p=${k} value="${esc(v)}">`}</div>`}).join('')+'</div><p class=m>Batas maksimum level diambil dari kode game. Kolom upgrade... belum diketahui batasnya.</p>'}
function vJson(){return`<textarea id=js>${esc(JSON.stringify(S.d,null,1))}</textarea><button data-x=jsa>Terapkan JSON</button>`}
function render(){$('#nv').innerHTML=TABS.map(([k,l])=>`<button data-x=tab data-v=${k}${S.tab==k?' class=on':''}>${l}</button>`).join('');st();
if(!S.d){$('#v').innerHTML=`<div class=card><p>Buka <b>idleguild_save.json</b> dari folder Download (hasil tombol Backup di game).</p><button class=p data-x=open>Buka file</button>${S.fh?`<button data-x=resume>Lanjutkan: ${esc(S.fh.name)}</button>`:''}${FSA?'':'<p class=m>Browser ini tidak bisa menimpa file langsung. Pakai Chrome terbaru. Mode unduh: file hasil unduhan bernama baru dan tidak menimpa.</p>'}</div>`;return}
$('#v').innerHTML={res:vRes,items:vItems,adv:vAdv,pets:vPets,guild:vGuild,json:vJson}[S.tab]()}
document.addEventListener('change',e=>{const t=e.target;if(!S.d)return;const v=t.type=='checkbox'?t.checked:t.type=='number'?Math.max(0,Math.min(t.dataset.max!=null?+t.dataset.max:9e15,Math.trunc(+t.value||0))):t.value;
if(t.dataset.p!=null){setp(S.d,t.dataset.p,v);dirty()}
else if(t.dataset.i!=null){S.d.items[t.dataset.i].stack=Math.max(1,v);dirty()}
else if(t.dataset.a!=null){const[i,p]=t.dataset.a.split('|'),a=S.d.adventurers[i];if(t.dataset.slot){v?a[p]={...a[p],stack:1,trueClass:v}:delete a[p]}else setp(a,p,v);dirty();if(p=='trueClass'||p=='level')render()}
else if(t.dataset.pet!=null){const[i,p]=t.dataset.pet.split('|'),pet=S.d.pets[i],val=t.type==='checkbox'?t.checked:t.type==='number'?Math.max(0,Math.trunc(+t.value||0)):t.value;if(p==='trueClass'){pet.trueClass=val;pet.petAbility1=(PET_FIXED[petType(val)]||['BLOODTHIRSTY'])[0];}else pet[p]=val;dirty();if(p==='trueClass'||p==='level')render()}
else if(t.dataset.all!=null){S.allc=t.checked;render()}
else if(t.id=='c'){S.cat=v;render()}
else if(t.dataset.raw!=null){try{S.d.adventurers[t.dataset.raw]=JSON.parse(t.value);dirty();render()}catch(x){toast('JSON tidak valid',1)}}});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;clearTimeout(S.tm);S.tm=setTimeout(()=>{render();const i=$('#q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-x]');if(!b)return;const k=b.dataset.x,v=b.dataset.v,A=S.d&&S.d.adventurers;
if(k=='open')openMain();else if(k=='refresh')refresh();else if(k=='save')save();
else if(k=='resume'){try{await load()}catch(x){if(stale(x)){toast('Akses file lama hilang, pilih file-nya lagi');S.fh=null;openMain()}else toast(x.message,1)}}
else if(k=='tab'){S.tab=v;S.q='';render()}
else if(!S.d)return;
else if(k=='add'){const[f,n]=v.split(':');S.d[f]=Math.min(9e15,(S.d[f]||0)+ +n);dirty();render()}
else if(k=='del'){S.d.items.splice(v,1);dirty();render()}
else if(k=='new'){const n=Math.max(1,Math.trunc(+$('#n_'+v).value||1)),x=S.d.items.find(i=>i.trueClass==v&&Object.keys(i).length==2);x?x.stack+=n:S.d.items.push({stack:n,trueClass:v});dirty();render();toast('Ditambahkan: '+nm(v)+' x'+n)}
else if(k=='info'){S.det=S.det==v?'':v;render()}
else if(k=='tog'){S.open=S.open==v?-1:+v;render()}
else if(k=='pet-tog'){S.open=S.open==v?-1:+v;render()}
else if(k=='pet+'){const P=S.d.pets??(S.d.pets=[]);const id=Math.max(0,...P.map(p=>+p.id||0))+1;P.push({favourite:false,food:0,id,level:1,petAbility1:(PET_FIXED.Wild||['BLOODTHIRSTY'])[0],trueClass:'Rat'});S.open=P.length-1;S.tab='pets';dirty();render()}
else if(k=='pet-'){if(confirm('Hapus pet ini?')){S.d.pets.splice(v,1);S.open=-1;dirty();render()}}
else if(k=='adv+'){const t=JSON.parse(JSON.stringify(A[0]||(S.d.tavernGuests||[])[0]||{ascended:false,doctrine:{l1:0,l2:0,l3:0,l4:0,l5:0,l6:0,trueClass:'EmptyDoctrine'},experience:0,level:1,potionsDrank:{},seen:false,timeWhenDismissed:0,currentHp:0,currentMana:0,currentShield:0,negativeStatusEffects:[],positiveStatusEffects:[],trueClass:'Footman'}));t.id=Math.max(0,...A.map(a=>a.id))+1;t.level=1;t.experience=0;A.push(t);S.open=A.length-1;dirty();render()}
else if(k=='adv-'){if(confirm('Hapus karakter ini?')){A.splice(v,1);S.open=-1;dirty();render()}}
else if(k=='jsa'){try{S.d=JSON.parse($('#js').value);S.d.items??=[];S.d.adventurers??=[];S.d.pets??=[];dirty();toast('JSON diterapkan (belum disimpan)')}catch(x){toast('JSON tidak valid: '+x.message,1)}}});
window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue=''}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{S.fh=await kv('fh');S.bh=await kv('bh');render()})();
</script></body></html>
